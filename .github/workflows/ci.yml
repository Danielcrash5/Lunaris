name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
          - name: Windows (MSVC)
            os: windows-latest
            cmake-args: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows, only if missing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Configure
        run: cmake --preset default ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

  sanitize:
    name: Linux (GCC, ASan + UBSan)
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset sanitize

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test
        run: ctest --preset sanitize

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The clang-tidy of Ubuntu 24.04 (version 18) cannot read <expected> from
      # the GCC 13 standard library, so a newer one is installed from PyPI.
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python3 -m venv .venv
          .venv/bin/pip install clang-tidy==23.1.4

      - name: Configure (creates compile_commands.json)
        run: cmake --preset default

      - name: Run clang-tidy
        run: .venv/bin/clang-tidy -p build src/*.cpp tests/*.cpp examples/*.cpp

  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build documentation (warnings are errors)
        run: doxygen docs/Doxyfile
